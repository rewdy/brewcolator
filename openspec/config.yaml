schema: spec-driven

# Project context
context: |
  Brewcolator is a client-side React 19 + TypeScript + Vite + Mantine v7 single-page application.
  Domain: Homebrew fermentation calculator for wine, cider, and mead (outcome forecasting & chaptalization).
  Styling: Swiss typography design (18px base md, tabular numbers, light/dark mode) using Mantine props and theme tokens. Minimal to zero custom CSS.
  Routing: wouter (/predict, /boost).
  State: jotai (atomWithStorage for unit preferences and baseline defaults).
  Package manager: Bun (bun.lock). Use bun, bun test, bun run build, bun run lint.
  TypeScript: verbatimModuleSyntax and erasableSyntaxOnly enabled (use 'import type', no enums).
